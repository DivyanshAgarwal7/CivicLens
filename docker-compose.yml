services:
  mongo:
    image: mongo:7
    restart: unless-stopped
    environment:
      MONGO_INITDB_ROOT_USERNAME: ${MONGO_ROOT_USERNAME:-civiclens}
      MONGO_INITDB_ROOT_PASSWORD: ${MONGO_ROOT_PASSWORD:?Set MONGO_ROOT_PASSWORD in the deployment environment}
    volumes:
      - mongo_data:/data/db
    healthcheck:
      test: ["CMD-SHELL", "mongosh --quiet --eval 'db.adminCommand({ ping: 1 }).ok' | grep 1"]
      interval: 10s
      timeout: 5s
      retries: 10

  backend:
    build:
      context: .
      dockerfile: backend/Dockerfile
    restart: unless-stopped
    environment:
      APP_ENV: production
      ALLOW_JSON_DB: "false"
      JWT_SECRET: ${JWT_SECRET:?Set JWT_SECRET in the deployment environment}
      MONGODB_URI: mongodb://${MONGO_ROOT_USERNAME:-civiclens}:${MONGO_ROOT_PASSWORD}@mongo:27017/civiclens?authSource=admin
      DB_NAME: civiclens
      CORS_ORIGINS: ${CORS_ORIGINS:-http://localhost:8080}
      AI_USE_GEMINI: ${AI_USE_GEMINI:-false}
      AI_EMBEDDING_MODEL: ${AI_EMBEDDING_MODEL:-all-MiniLM-L6-v2}
    depends_on:
      mongo:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/api/health', timeout=3)"]
      interval: 10s
      timeout: 5s
      retries: 10

  frontend:
    build:
      context: frontend
      dockerfile: Dockerfile
    restart: unless-stopped
    ports:
      - "8080:80"
    depends_on:
      backend:
        condition: service_healthy

volumes:
  mongo_data:
